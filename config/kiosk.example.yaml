version: 1
display:
  mode: 1920x1080
  # Reload each pane this often. 300 is 5 minutes. 0 disables refresh.
  # A pane can set its own refresh_seconds to override this.
  refresh_seconds: 300
login:
  password_file: ~/.config/kiosk-lite/odoo-login
panes:
  # hide_navbar removes the Odoo web-client bar. A page without that bar is unchanged.
  # Replace the example.com URLs. Panes on one host share a Wayland app id.
  - id: lead_times
    hide_navbar: true
    url: https://example.com/lead-times
    x: 0
    y: 0
    width: 640
    height: 540
  - id: production_schedule
    hide_navbar: true
    url: https://example.com/production-schedule
    x: 640
    y: 0
    width: 1280
    height: 540
  - id: meeting_notes
    hide_navbar: true
    url: https://example.com/meeting-notes
    x: 0
    y: 540
    width: 640
    height: 540
  - id: dashboard
    hide_navbar: true
    url: https://example.com/dashboard
    x: 640
    y: 540
    width: 1280
    height: 540
